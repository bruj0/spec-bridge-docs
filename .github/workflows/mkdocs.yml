# GitHub Pages deploy for the docs/ site.
#
# Builds the site with `mkdocs build --strict` and pushes the
# generated `_site/` directory to the `gh-pages` branch using
# `peaceiris/actions-gh-pages`. GitHub Pages is configured (in
# the repo UI) to serve from that branch, so the deploy happens
# by simply updating `gh-pages` -- no `actions/deploy-pages`
# involved, which avoids the intermittent Twirp/REST API 5xx
# errors we kept seeing.
#
# Two jobs:
#   - `build`  -- runs on PR + push to main; verifies the
#     build succeeds under `--strict` and uploads `site/` as a
#     workflow artifact for review.
#   - `deploy` -- runs on push to main after `build`; pushes
#     `_site/` to the `gh-pages` branch via the
#     peaceiris/actions-gh-pages action.
#
# Trigger pattern:
#   - push to main when docs/**, mkdocs.yml,
#     .github/workflows/mkdocs.yml, or pyproject.toml change
#   - pull_request to main with the same path filters (just
#     for the build job)

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/mkdocs.yml"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/mkdocs.yml"
      - "pyproject.toml"
  workflow_dispatch:    # allow manual runs from the Actions UI / gh CLI

# Allow multiple deploys to run in parallel. Setting
# `cancel-in-progress: true` would race with the auto-injected
# `pages build and deployment` workflow that GitHub runs when
# Pages is configured with the "GitHub Actions" source, and
# would cancel our deploy job before the gh-pages push lands.
# (Once Pages is switched to "Deploy from a branch", the
# auto-injected workflow stops running and this no longer
# matters, but we keep the safe default regardless.)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # required to push the gh-pages branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4"

      - name: Install Python dependencies (with [docs] extra)
        run: |
          uv sync --extra docs

      - name: Build the site (--strict)
        # --strict turns broken anchors / nav references into
        # build errors so the PR can be fixed before merge.
        run: |
          uv run mkdocs build --strict --site-dir site

      - name: Upload the built site as a workflow artifact
        # Useful for downloading site/ to inspect a PR build.
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    # Only deploy on push to main; PRs only run the build
    # job for verification.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4"

      - name: Build the site for deployment
        run: |
          uv sync --extra docs
          uv run mkdocs build --strict --site-dir _site

      - name: Deploy _site/ to the gh-pages branch
        # peaceiris/actions-gh-pages pushes the contents of
        # `publish_dir` to the `gh-pages` branch as a single
        # force-push commit. Configure Pages in repo Settings
        # -> Pages -> Source: "Deploy from a branch" ->
        # Branch: `gh-pages` / `/ (root)`.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # Keep the gh-pages branch history shallow to avoid
          # unbounded growth from per-deploy commits.
          keep_files: false
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: deploy site (${{ github.sha }})"
